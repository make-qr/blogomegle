<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if page.noindex %}
<meta name="robots" content="noindex, follow">
{% endif %}
<link rel="icon" href="{{ '/assets/images/logo-icon.png' | relative_url }}?v=4" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v=8">
{% if page.hero_image %}
<link rel="preload" as="image" href="{{ page.hero_image | relative_url }}?v=2">
{% endif %}
{% include adsense-loader.html %}
{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
<script>
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.chat-cta-link, a[data-cta="chat"]');
    if (!a || typeof gtag !== 'function') return;
    gtag('event', 'chat_cta_click', {
      event_category: 'conversion',
      event_label: a.getAttribute('data-cta-placement') || 'unknown',
      link_url: a.href
    });
  });
</script>
{% endif %}
{% seo %}
