<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "OmegleChat",
  "url": {{ site.main_site | jsonify }},
  "logo": {{ '/assets/images/logo-omegle.png' | absolute_url | jsonify }},
  "email": "omeglechatonline@gmail.com"
}
</script>
{% unless page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ '/' | absolute_url | jsonify }}
    }
    {% if page.layout == 'post' and page.pillar %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.category | jsonify }},
      "item": {{ '/' | append: page.pillar | append: '/' | absolute_url | jsonify }}
    },{
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% else %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% endif %}
  ]
}
</script>
{% endunless %}
